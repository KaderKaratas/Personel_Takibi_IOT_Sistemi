<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yetkili Paneli</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f4f4f9;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            border-bottom: 1px solid #34495e;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background-color: #1abc9c;
        }
        .content-area {
            flex: 1; /* Geri kalan tüm alanı kaplar */
            display: flex;
            flex-direction: column;
        }
        /* İframe ayarı: Tıklanan menüler bu çerçevenin içinde açılacak */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <script src="/auth-check.js"></script>
</head>
<body>

    <!-- Sol Menü -->
    <div class="sidebar">
        <h2>YETKİLİ PANELİ</h2>
        <!-- target="icerikEkrani" diyerek linklerin iframe içinde açılmasını sağlıyoruz -->
        <a href="personel-yonetimi.html" target="icerikEkrani">PERSONEL YÖNETİMİ</a>
        <a href="kart-atama.html" target="icerikEkrani">KART ATAMA</a>
        <a href="izin-mazeret.html" target="icerikEkrani">İZİN / MAZERET</a>
        <a href="analizler.html" target="icerikEkrani">ANALİZLER</a>
        <div style="margin-top: auto; border-top: 1px solid #34495e;">
            <!-- Basit ve şık bir Açılır Menü (Dropdown) Yapısı -->
            <details style="padding: 15px 20px; cursor: pointer; color: white;">
                <summary style="font-weight: bold; outline: none;">Hesabım</summary>
                <div style="display: flex; flex-direction: column; margin-top: 10px; padding-left: 10px;">
                    <a href="sifre-degistir.html" target="icerikEkrani" style="padding: 8px 0; border: none; font-size: 14px;">Şifre İşlemleri</a>
                    <a href="/login" style="padding: 8px 0; border: none; color: #e74c3c; font-size: 14px;">Çıkış Yap</a>
                </div>
            </details>
        </div>
    </div>

    <!-- Sağ Taraf İçerik (Sayfaların açılacağı yer) -->
    <div class="content-area">
        <!-- Sayfa ilk açıldığında varsayılan olarak personel yönetimi gelsin -->
        <iframe name="icerikEkrani" src="personel-yonetimi.html"></iframe>
    </div>

</body>
</html>
