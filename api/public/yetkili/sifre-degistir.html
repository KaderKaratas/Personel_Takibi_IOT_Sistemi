<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şifre Değiştir - Yetkili Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/auth-check.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h3 class="mb-4 text-center">Yetkili Şifre Değiştir</h3>
                    
                    <form id="sifreFormu">
                        <div class="mb-3">
                            <label class="form-label">Mevcut Şifre</label>
                            <input type="password" id="mevcut_sifre" class="form-control" maxlength="50" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Yeni Şifre (En fazla 50 karakter)</label>
                            <input type="password" id="yeni_sifre" class="form-control" maxlength="50" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Şifreyi Güncelle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sifreFormu').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const mevcut_sifre = document.getElementById('mevcut_sifre').value;
            const yeni_sifre = document.getElementById('yeni_sifre').value;

            try {
                const response = await fetch('http://localhost:8080/api/sifre/sifre-guncelle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mevcut_sifre, yeni_sifre })
                });

                const result = await response.json();
                alert(result.message);

                if (result.success) {
                    document.getElementById('sifreFormu').reset();
                }
            } catch (err) {
                console.error('Hata:', err);
                alert('Sunucuya bağlanırken bir hata oluştu.');
            }
        });
    </script>
</body>
</html>
